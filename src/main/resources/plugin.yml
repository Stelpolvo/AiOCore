name: AiOCore
version: '${project.version}'
authors: ["Stelpolvo"]
main: com.github.stelpolvo.aiocore.AiOCore

api-version: '1.18'
depend:
  - Vault
  - PlaceholderAPI
libraries:
  - 'org.xerial:sqlite-jdbc:3.44.1.0'
  - 'com.mysql:mysql-connector-j:8.3.0'
  - 'com.zaxxer:HikariCP:7.1.0'
  - 'net.kyori:adventure-platform-bukkit:4.4.1'
  - 'net.kyori:adventure-api:${adventure.version}'
  - 'net.kyori:adventure-text-serializer-plain:${adventure.version}'
  - 'net.kyori:adventure-text-serializer-gson:${adventure.version}'
  - 'net.kyori:adventure-text-serializer-legacy:${adventure.version}'
commands:
  aio:
    description: aio 主命令
    usage: /aio help
    aliases:
      - a
permissions:
  aio.command.admin:
    default: op
    children:
      aio.command.def: true
      aio.command.admin.economy: true
      aio.command.admin.stash: true
  aio.command.def:
    default: true
    children:
      aio.command.def.economy: true
      aio.command.def.chat: true
      aio.command.def.stash: true
  aio.command.def.economy:
    default: true
    children:
      aio.command.def.economy.pay: true
      aio.command.def.economy.look: true
  aio.command.def.economy.pay:
    default: true
  aio.command.def.economy.look:
    default: true
  aio.command.admin.economy:
    default: op
    children:
      aio.command.admin.economy.get: true
      aio.command.admin.economy.set: true
      aio.command.admin.economy.take: true
      aio.command.admin.economy.give: true
  aio.command.admin.economy.get:
    default: op
  aio.command.admin.economy.set:
    default: op
  aio.command.admin.economy.take:
    default: op
  aio.command.admin.economy.give:
    default: op

  aio.command.def.chat:
    default: true
    children:
      aio.command.def.chat.name: true
      aio.command.def.chat.message: true
      aio.command.def.chat.chat: true
      aio.command.def.chat.sound: true
      aio.command.def.chat.channel: true
  aio.command.def.chat.name:
    default: true
  aio.command.def.chat.message:
    default: true
  aio.command.def.chat.chat:
    default: true
  aio.command.def.chat.sound:
    default: true
  aio.command.def.chat.channel:
    default: true

  # ============================================================
  # Stash
  # 页码权限逐页判定，page.N 全部默认 false，由权限插件按需授予。
  # 新增页时在下面补 aio.command.def.stash.page.N: default: false 即可。
  # ============================================================
  aio.command.def.stash:
    default: true
    children:
      aio.command.def.stash.page.1: true
      aio.command.def.stash.page.2: true
      aio.command.def.stash.page.3: true
  aio.command.def.stash.page.1:
    default: false
  aio.command.def.stash.page.2:
    default: false
  aio.command.def.stash.page.3:
    default: false

  aio.command.admin.stash:
    default: op
    children:
      aio.command.admin.stash.view: true
  aio.command.admin.stash.view:
    default: op